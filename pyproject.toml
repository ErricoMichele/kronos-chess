[project]
name = "chessengine"
version = "0.1.0"
description = "A from-scratch bitboard chess engine with UCI support"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
tablebase = ["python-chess>=1.0"]

[project.scripts]
chessengine = "chessengine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: perft depth 5-6 reference positions (architecture.md §14); excluded by default, run with `pytest -m slow`",
]
addopts = "-m 'not slow'"
